<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>EON Prototype</title>
<style>
:root{--bg:#f6f6f2;--paper:#fff;--ink:#171715;--muted:#70706a;--line:#deded8;--soft:#efefe9}
*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Inter,Arial,sans-serif;color:var(--ink)}
.app{width:min(820px,100%);min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 0 60px rgba(0,0,0,.05)}
header{height:66px;padding:0 24px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);z-index:5}
.brand{font-weight:800;letter-spacing:.16em}.nav{display:flex;gap:8px}main{padding:38px 30px 72px}
h1{font-size:42px;line-height:1.04;letter-spacing:-.035em;margin:0 0 18px}h2{font-size:28px;margin:0 0 14px}h3{font-size:18px;margin:0 0 10px}p{font-size:17px;line-height:1.6;margin:0 0 16px}.muted,.meta{color:var(--muted)}.meta{font-size:12px}
.card{border:1px solid var(--line);border-radius:18px;padding:18px;margin:14px 0;background:#fff}.promise{background:var(--soft);padding:20px;border-radius:18px;margin:18px 0}.quote{font-size:21px;line-height:1.5;border-left:3px solid var(--ink);padding:8px 0 8px 18px;margin:22px 0}
button{border:0;background:var(--ink);color:white;padding:12px 17px;border-radius:999px;font-size:15px;font-weight:700;cursor:pointer}.secondary{background:#fff;color:var(--ink);border:1px solid var(--line)}.link{background:transparent;color:var(--ink);padding:8px 10px}
textarea{width:100%;min-height:132px;border:1px solid var(--line);border-radius:15px;padding:15px;font:inherit;resize:vertical;outline:none}.row{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.choice{display:block;width:100%;text-align:left;background:#fff;color:var(--ink);border:1px solid var(--line);margin:9px 0;border-radius:15px}
.metric-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:22px 0}.metric{padding:15px;border:1px solid var(--line);border-radius:16px}.metric b{font-size:24px;display:block}.decision{padding:17px;border:1px solid var(--line);border-radius:17px;margin:12px 0}.label{text-transform:uppercase;letter-spacing:.13em;font-size:11px;color:var(--muted);margin-bottom:6px}.assessment{font-size:28px;font-weight:800;letter-spacing:-.02em}.pill{display:inline-block;font-size:12px;padding:6px 9px;background:var(--soft);border-radius:999px;margin:3px}.understanding{padding:14px 0;border-bottom:1px solid var(--soft)}.understanding:last-child{border-bottom:0}.status{font-size:11px;border:1px solid var(--line);border-radius:999px;padding:4px 7px;margin-left:5px}.trace{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;background:#f7f7f4;padding:14px;border-radius:14px;white-space:pre-wrap;overflow:auto}
@media(max-width:620px){main{padding:28px 20px 60px}h1{font-size:34px}.metric-grid{grid-template-columns:1fr}.app{box-shadow:none}}
</style>
</head>
<body>
<div class="app"><header><div class="brand">EON</div><div class="nav"><button class="link" id="youBtn">You</button><button class="link" id="resetBtn">Reset</button></div></header><main id="main"></main></div>
<script>
const KEY='eon_proto_state_v1';
const fresh=()=>({stage:'trust',onboardingIndex:0,answers:{about:'',future:'',why:'',trust:'',difficulty:'',accountability:'',boundary:''},humanModel:[],corrections:[],decisions:[],watching:[],currentDecision:null});
let S=load();
function load(){try{return JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){return fresh()}}function save(){localStorage.setItem(KEY,JSON.stringify(S))}
const main=document.getElementById('main');const esc=s=>(s||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));const short=(s,n=150)=>s.length>n?s.slice(0,n)+'…':s;
document.getElementById('youBtn').onclick=()=>{S.stage='you';save();render()};document.getElementById('resetBtn').onclick=()=>{if(confirm('Reset this prototype and erase local test data?')){S=fresh();save();render()}};
function render(){({trust,independence,depth,onboarding,mirror,home,you,decision}[S.stage]||trust)()}
function trust(){main.innerHTML=`<h1>Health is complicated.<br>Understanding what to do shouldn't be.</h1><p>EON develops a living understanding of you so it can help determine <b>what matters, what doesn't, and what to do next.</b></p><div class="promise"><h3>Certificate of Trust</h3><p>What you share—and what EON learns—is used to understand and serve <b>you</b>.</p><p>EON may use understanding to improve service, but never to exploit vulnerability in order to produce compliance.</p><p>Commercial interests never determine what EON tells you, recommends, or withholds.</p><p>EON distinguishes what it knows, infers, suspects, and does not know.</p><p><b>The more EON understands about you, the greater its responsibility to protect that trust.</b></p></div><button id="go">I understand</button>`;go.onclick=()=>{S.stage='independence';save();render()}}
function independence(){main.innerHTML=`<h1>EON is here to serve you—not simply agree with you.</h1><p>Understanding you changes <b>how EON serves you.</b> It never changes what EON believes to be true.</p><div class="quote">You should expect EON to be on your side—even when it isn't on the side of your decision.</div><p>EON may disagree, recommend another qualified opinion, or tell you there isn't enough evidence to support something you want to do.</p><p class="muted">New evidence can change EON's judgment. Pressure cannot.</p><button id="go">I understand</button>`;go.onclick=()=>{S.stage='depth';save();render()}}
function depth(){main.innerHTML=`<h1>You decide how much EON knows.</h1><p>Share what you're comfortable sharing. Connect only what you choose.</p><p>EON can become more useful with more context, but deeper disclosure is never a requirement for dignity or basic usefulness.</p><div class="quote">EON's job is not to know everything about you. Its job is to use what you choose to share wisely.</div><button id="go">Begin</button>`;go.onclick=()=>{S.stage='onboarding';save();render()}}
const Q=[['about','Let’s start with you.','Before we talk about health, tell me a little about yourself. Who are you these days?','Work, family, what your weeks look like, what matters...'],['future','Look ahead.','Imagine yourself 15 or 20 years from now. What are you hoping your health still allows you to do?','Travel, family, golf, independence, capability...'],['why','Why EON, and why now?','What made you decide to try EON today?','A decision, uncertainty, prevention, a recent change...'],['trust','Trust.','When you’re making an important health decision, what makes you trust something?','A physician, research, several sources, lived experience, transparent reasoning...'],['difficulty','Decision friction.','What makes health decisions difficult for you?','Conflicting information, fear, time, procrastination, not knowing what matters...'],['accountability','Accountability.','If you make a commitment and don’t follow through, what should EON do?','Point it out, ask why, help adjust, leave it alone...'],['boundary','Boundary.','What should EON never become for you?','Don’t nag me. Don’t overwhelm me. Don’t hide uncertainty...']];
function onboarding(){const [k,t,q,p]=Q[S.onboardingIndex];main.innerHTML=`<div class="meta">Understanding ${S.onboardingIndex+1} of ${Q.length}</div><h1>${t}</h1><p><b>${q}</b></p><textarea id="a" placeholder="${p}">${esc(S.answers[k]||'')}</textarea><div class="row"><button id="next">Continue</button>${S.onboardingIndex?'<button class="secondary" id="prev">Back</button>':''}</div>`;next.onclick=()=>{S.answers[k]=a.value.trim();if(S.onboardingIndex<Q.length-1){S.onboardingIndex++;save();render()}else{buildHM();S.stage='mirror';save();render()}};if(document.getElementById('prev'))prev.onclick=()=>{S.onboardingIndex--;save();render()}}
function buildHM(){const a=S.answers;S.humanModel=[];const add=(domain,statement,status='USER-STATED',confidence='STRONG',allowed='',prohibited='')=>{if(statement)S.humanModel.push({id:crypto.randomUUID(),domain,statement,status,confidence,allowed,prohibited,active:true})};add('LIFE CONTEXT',a.about,'USER-STATED','STRONG','Fit service into real-life context','Do not infer sensitive traits');add('FUTURE SELF',a.future,'USER-STATED','STRONG','Prioritize outcomes relevant to stated future','Never use fears or relationships as emotional leverage');add('JOB TO BE DONE',a.why,'USER-STATED','STRONG','Orient initial service around expressed need','Do not assume this need is permanent');add('TRUST ARCHITECTURE',a.trust,'USER-STATED','EMERGING','Choose transparent reasoning and source depth','Never change evidence quality to match trust preference');add('DECISION FRICTION',a.difficulty,'USER-STATED','EMERGING','Ask and structure around reported friction','Do not label the user or assume cause');add('ACCOUNTABILITY',a.accountability,'USER-STATED','STRONG','Use requested accountability style within explicit commitments','No guilt, shame, repeated pressure, or emotional leverage');add('BOUNDARY',a.boundary,'BOUNDARY','VERIFIED','Constrain EON behavior','Only material safety changes may reopen the issue, with explanation')}
function mirror(){const list=S.humanModel.map(x=>`<div class="understanding"><div class="label">${esc(x.domain)} <span class="status">${esc(x.status)}</span></div><p>${esc(x.statement)}</p></div>`).join('');main.innerHTML=`<h1>Here’s what I think I’m beginning to understand.</h1><div class="card">${list}<p class="meta">This is a working understanding, not a permanent profile.</p></div><p><b>What did I get wrong?</b></p><textarea id="corr" placeholder="Correct anything that doesn’t feel accurate."></textarea><div class="row"><button id="accept">Mostly right — begin</button><button class="secondary" id="correct">Save correction & begin</button></div>`;accept.onclick=()=>{S.stage='home';save();render()};correct.onclick=()=>{const c=corr.value.trim();if(c){S.corrections.push(c);S.humanModel.push({id:crypto.randomUUID(),domain:'USER CORRECTION',statement:c,status:'VERIFIED',confidence:'VERIFIED',allowed:'Revise affected service assumptions',prohibited:'Do not defend superseded inference',active:true})}S.stage='home';save();render()}}
function home(){const open=S.decisions.filter(d=>d.status==='OPEN');main.innerHTML=`<h1>What are you trying to figure out?</h1><textarea id="question" placeholder="My doctor wants me on a statin… Should I take creatine?… My A1C increased…"></textarea><div class="row"><button id="ask">Ask EON</button></div><div class="metric-grid"><div class="metric"><b>${open.length}</b><span class="meta">Current decisions</span></div><div class="metric"><b>${S.watching.length}</b><span class="meta">Watching</span></div><div class="metric"><b>↻</b><span class="meta">Understanding you</span></div></div>${open.map(d=>`<div class="decision" onclick="openDecision('${d.id}')"><div class="label">${esc(d.action)}</div><b>${esc(short(d.question,110))}</b></div>`).join('')}<p class="meta">This prototype stores test data only in this browser. It is not yet connected to a live AI model or clinical evidence service.</p>`;ask.onclick=()=>{const q=question.value.trim();if(q)createDecision(q)}}
function classify(q){const s=q.toLowerCase();const high=/cancer|tumor|chest pain|stroke|overdose|chemo|surgery|pregnan|prescription|medication|statin/.test(s);const data=/lab|a1c|ldl|hdl|apob|calcium|blood|test result/.test(s);const supp=/supplement|creatine|peptide|vitamin|protein|magnesium|compound/.test(s);let action=high?'ASK / POSSIBLE ESCALATE':'ASK';let worth=high?'HIGH':(data||supp)?'MODERATE':'UNASSESSED';let missing=['What outcome are you trying to achieve?','What relevant health context could change the answer?','What evidence or recommendation are you reacting to?'];if(data)missing=['What exact result changed, and when?','Is this a one-time result or a trend?','What other related results or clinical context do you have?'];if(supp)missing=['What specifically are you considering?','What outcome are you hoping for?','What medications, supplements, conditions, or recent labs could affect safety or relevance?'];return{action,worth,missing,reason:high?'The consequence of being wrong may be high enough that EON should gather missing context and consider qualified clinical review before resolving the decision.':'EON does not yet have enough decision-specific evidence to responsibly recommend an action.'}}
function delivery(){const t=(S.answers.trust+' '+S.answers.difficulty+' '+S.answers.boundary).toLowerCase();const a=[];if(/research|study|evidence|source|detail/.test(t))a.push('Make evidence depth available');else a.push('Lead with synthesis; deeper evidence on request');if(/overwhelm|too much|conflict/.test(t))a.push('Reduce cognitive load');if(/nag|leave.*alone|don’t.*push|don't.*push/.test(t))a.push('Low-interruption posture');return a}
function createDecision(q){const c=classify(q);const d={id:crypto.randomUUID(),question:q,status:'OPEN',created:new Date().toISOString(),action:c.action,worth:c.worth,missing:c.missing,reason:c.reason,trace:{evidence_state:'INCOMPLETE',decision_worthiness:c.worth,guidance_viability:'PARTIALLY VIABLE',service_action:c.action,delivery_strategy:delivery(),governor:'Truth, evidence, safety, trust and agency do not adapt'}};S.decisions.unshift(d);S.currentDecision=d.id;S.stage='decision';save();render()}
window.openDecision=id=>{S.currentDecision=id;S.stage='decision';save();render()};
function decision(){const d=S.decisions.find(x=>x.id===S.currentDecision);if(!d){S.stage='home';return render()}main.innerHTML=`<div class="label">Decision</div><h1>${esc(d.question)}</h1><div class="card"><div class="label">EON’S CURRENT ACTION</div><div class="assessment">${esc(d.action)}</div><p>${esc(d.reason)}</p></div><div class="card"><div class="label">Decision-worthiness</div><h2>${esc(d.worth)}</h2><p class="muted">Decision-worthiness is evaluated before personalization.</p></div><div class="card"><div class="label">What EON needs next</div>${d.missing.map((x,i)=>`<p><b>${i+1}.</b> ${esc(x)}</p>`).join('')}</div><div class="card"><div class="label">How EON is adapting service</div>${d.trace.delivery_strategy.map(x=>`<span class="pill">${esc(x)}</span>`).join('')}<p class="meta" style="margin-top:10px">These adaptations may change how much and how EON communicates. They may not change truth, evidence quality, or safety thresholds.</p></div><details class="card"><summary><b>Decision trace</b></summary><div class="trace">${esc(JSON.stringify(d.trace,null,2))}</div></details><div class="row"><button id="back">Back home</button><button class="secondary" id="resolve">Mark resolved</button></div>`;back.onclick=()=>{S.stage='home';save();render()};resolve.onclick=()=>{d.status='RESOLVED';S.stage='home';save();render()}}
function you(){const list=S.humanModel.map(x=>`<div class="understanding"><div class="label">${esc(x.domain)} <span class="status">${esc(x.status)}</span> <span class="status">${esc(x.confidence)}</span></div><p>${esc(x.statement)}</p><div class="meta">Allowed: ${esc(x.allowed||'—')}<br>Prohibited: ${esc(x.prohibited||'—')}</div></div>`).join('');main.innerHTML=`<h1>You</h1><p class="muted">What EON currently understands that may legitimately improve how it serves you.</p><div class="card">${list||'<p>No Human Model yet.</p>'}</div><h3>Correct EON</h3><textarea id="newcorr" placeholder="Something here is wrong or incomplete..."></textarea><div class="row"><button id="savecorr">Save correction</button><button class="secondary" id="homebtn">Home</button></div>`;savecorr.onclick=()=>{const c=newcorr.value.trim();if(c){S.corrections.push(c);S.humanModel.push({id:crypto.randomUUID(),domain:'USER CORRECTION',statement:c,status:'VERIFIED',confidence:'VERIFIED',allowed:'Revise affected service assumptions',prohibited:'Do not defend superseded inference',active:true});save();render()}};homebtn.onclick=()=>{S.stage='home';save();render()}}
render();
</script>
</body>
</html>
